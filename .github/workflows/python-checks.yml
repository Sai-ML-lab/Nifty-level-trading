name: Python checks

on:
  push:
    branches:
      - feature/otm-band-and-candle-timing
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit and scenario tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Compile application modules
        run: python -m compileall -q nifty_trader streamlit_app.py run_engine.py
